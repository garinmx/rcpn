<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ruta no encontrada | RCPN</title>
    <meta name="robots" content="noindex, follow">
    <link rel="canonical" href="https://rcpn.me/">
    <link rel="icon" href="favicon.ico" type="image/x-icon">
    <link rel="preload" href="css/estilos.css" as="style" onload="this.onload=null;this.rel='stylesheet'">
    <noscript><link rel="stylesheet" href="css/estilos.css"></noscript>
    <style>
        .page-404{min-height:100svh;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:48px 16px;background:var(--bg-base)}
        .page-404__code{font-family:var(--font-heading,'Montserrat','Segoe UI',sans-serif);font-size:clamp(5rem,20vw,10rem);font-weight:800;color:var(--dorado-ley,#c5a059);line-height:1;margin-bottom:0}
        .page-404__title{font-family:var(--font-heading,'Montserrat','Segoe UI',sans-serif);font-size:clamp(1rem,3vw,1.4rem);text-transform:uppercase;letter-spacing:.12em;color:var(--text-primary,#f0f0f0);margin:12px 0 24px}
        .page-404__quote{font-style:italic;color:var(--text-secondary,#a0a0a0);max-width:560px;font-size:clamp(.95rem,2.5vw,1.1rem);line-height:1.75;margin-bottom:40px;border-left:3px solid var(--dorado-ley,#c5a059);padding-left:20px;text-align:left}
        .page-404__btn{display:inline-flex;align-items:center;gap:8px;background:transparent;color:var(--dorado-ley,#c5a059);font-family:var(--font-heading,'Montserrat','Segoe UI',sans-serif);font-size:.82rem;font-weight:800;text-transform:uppercase;letter-spacing:.1em;text-decoration:none;padding:16px 36px;border-radius:100px;border:2px solid var(--dorado-ley,#c5a059);min-height:52px;transition:background .2s ease,color .2s ease}
        .page-404__btn:hover{background:var(--dorado-ley,#c5a059);color:var(--azul-autoridad,#0d1b2a)}
        .page-404__btn:focus{outline:3px solid var(--dorado-ley,#c5a059);outline-offset:4px}
    </style>
    <meta name="theme-color" content="#0d1b2a">
</head>
<body>
    <main class="page-404" id="main-content">
        <p class="page-404__code" aria-label="Error 404">404</p>
        <h1 class="page-404__title">Ruta fuera de jurisdicción</h1>
        <blockquote class="page-404__quote">
            "La justicia puede tardar en llegar, pero el camino a la verdad siempre está disponible."
        </blockquote>
        <a href="/" class="page-404__btn">← Volver al Portal Nacional</a>
    </main>

    <footer class="main-footer" role="contentinfo">
        <div class="container">
            <p>&copy; <span id="footer-year"></span> RCPN | rcpn.me | Defendiendo la Soberanía Ciudadana</p>
        </div>
    </footer>
    <script>document.getElementById('footer-year').textContent = new Date().getFullYear();</script>
</body>
</html>
